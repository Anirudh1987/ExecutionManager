[project]
name = "execution-manager"
version = "0.2.0"
description = "AI-powered M&A contract review platform with human-in-the-loop workflow"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
    "pydantic>=2.6.0",
    "anthropic>=0.40.0",
    "python-multipart>=0.0.9",
    "pymupdf>=1.24.0",
    "aiosqlite>=0.20.0",
    "websockets>=12.0",
    "python-docx>=1.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
